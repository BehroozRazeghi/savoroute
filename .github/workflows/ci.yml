name: CI
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[api,mcp,dev,notebooks]"
      - run: python -m pytest
      - run: ruff check src tests scripts
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Web interface contract tests
        run: |
          node --input-type=module --check < src/savoroute/web/static/app.js
          node --check src/savoroute/web/static/api.mjs
          node --input-type=module --check < src/savoroute/web/static/visits-review.js
          node --input-type=module --check < src/savoroute/web/static/study-review.js
          node --test tests/web/*.test.mjs
      - name: Notebook smoke tests
        run: |
          python - <<'PY'
          import pathlib
          import nbformat
          from nbclient import NotebookClient
          for path in sorted(pathlib.Path('notebooks').glob('*.ipynb')):
              notebook = nbformat.read(path, as_version=4)
              NotebookClient(notebook, timeout=90, kernel_name='python3',
                             resources={'metadata': {'path': '.'}}).execute()
              print('OK', path)
          PY
  consumer_web:
    name: Consumer web build and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e ".[api,dev]"
      - name: Install consumer frontend dependencies
        working-directory: webapp
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build consumer frontend
        working-directory: webapp
        run: npm run build
      - name: Verify packaged consumer routes
        run: python -m pytest -q tests/test_consumer_web_m6.py tests/test_web_app.py
      - name: Install Chromium for browser tests
        working-directory: webapp
        run: npx playwright install --with-deps chromium
      - name: Consumer browser smoke tests
        working-directory: webapp
        run: npm run test:e2e
