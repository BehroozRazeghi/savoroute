[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "savoroute"
version = "0.9.0"
description = "Food catalog ingestion, multimodal vector search, and retrieval evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["food discovery", "catalog search", "image ingestion", "retrieval evaluation"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "Pillow>=10,<13"]
openai = ["openai>=2,<4"]
images = ["Pillow>=10,<13"]
multimodal = ["Pillow>=10,<13", "sentence-transformers>=3,<7"]
ann = ["numpy>=1.26,<3", "faiss-cpu>=1.9,<2"]
notebooks = ["jupyterlab>=4,<5", "ipykernel>=6,<8", "nbclient>=0.10,<1", "nbformat>=5,<6", "Pillow>=10,<13"]

[project.scripts]
savoroute = "savoroute.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"savoroute.resources" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
